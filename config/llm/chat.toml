# model-citizen llm configuration: chat
#
# The llm reads chat.toml, stt.toml and tts.toml from this folder. chat.toml is
# required; delete stt.toml or tts.toml to turn transcription or speech off.
#
# There are no defaults: every key under [chat] and [chat.rotation] is
# required, as are at least one personality and one [[chat.clients]] entry.
# Missing and unknown keys are an error, so mistakes are caught at startup.
# Restart the bot to apply.
#
# Durations are strings such as "500ms", "5s", "2m".
# API keys belong in .env, never in these files: each client names the
# environment variable that holds its key.

[chat]
# Messages kept per channel and sent with each reply.
history_size = 20
# How long one reply may take, across every client it fails over to.
reply_timeout = "30s"
# How long one attempt on one client may take before failing over to the next.
per_client_timeout = "10s"
# The personality every conversation starts with. Must be a name below.
default_personality = "default"

# Personalities: the markdown file holding the system prompt, and the voice
# it speaks with, a name from [tts.voices]. Prompt paths are relative to this
# file. Leave voice out and the personality never speaks.
[chat.personalities.default]
prompt = "personalities/default.md"
voice = "cheery"

[chat.personalities.cool]
prompt = "personalities/cool.md"
voice = "cool"

# Every call is timed, and the rotation moves off clients that are slow or
# down. Must satisfy 0 < reward <= punish <= kill.
[chat.rotation]
# A call this fast takes 1 off the client's score (never below 0).
reward = "2s"
# A call this slow adds 2 to the score. A score of 10 benches the client.
punish = "5s"
# A call this slow benches the client at once. So does an error.
kill = "10s"
# How long a benched client sits out before it's tried again.
parole = "5m"

# Chat clients, tried in order. Any OpenAI compatible endpoint works.
#
# Only model and api_key_env are required. Every other setting is left out of
# the request when unset, so the provider's default applies.
#
#   base_url               endpoint, leave out for OpenAI's
#   temperature            0 to 2. Reasoning models reject it
#   top_p                  above 0, at most 1
#   max_completion_tokens  reply length cap, reasoning tokens count toward it
#   presence_penalty       -2 to 2, positive discourages repeating topics
#   frequency_penalty      -2 to 2, positive discourages repeating words
#   seed                   best effort deterministic sampling
#   reasoning_effort       minimal | low | medium | high, reasoning models only
#   stop                   up to 4 strings that end the reply early
#   extra_body             provider specific fields added to the request
[[chat.clients]]
model = "gemma4:31b"
base_url = "https://ollama.com/v1"
api_key_env = "OLLAMA_MODEL_KEY"
temperature = 0.85
top_p = 0.9
max_completion_tokens = 250

[[chat.clients]]
model = "qwen/qwen3.8-27b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_KEY"
temperature = 0.85
top_p = 0.9
max_completion_tokens = 250

[[chat.clients]]
model = "nvidia/nemotron-3-super-120b-a12b"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "MODEL_AUTH_KEY"
temperature = 0.85
top_p = 0.9
max_completion_tokens = 250
extra_body = { chat_template_kwargs = { enable_thinking = false } }
