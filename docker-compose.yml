services:
  bot:
    build: .
    volumes:
      - music-provider:/music
      # The model rotations. data/ is not in the image, so they are mounted
      # rather than baked in: adding or dropping a model is a restart, not a
      # rebuild.
      - ./data/text-models.json:/app/text-models.json:ro
      - ./data/voice-models.json:/app/voice-models.json:ro
      - ./data/speech-models.json:/app/speech-models.json:ro
      # go-ytdlp caches its binaries under os.UserCacheDir (/root/.cache here).
      # Persist it or every restart re-downloads yt-dlp and bun.
      - ytdlp-cache:/root/.cache
    env_file:
      - path: .env
        required: true

volumes:
  music-provider:
  ytdlp-cache:
