services:
  discord-bot:
    build:
      context: .
      dockerfile: discord-bot/Dockerfile
    env_file: .env
    environment:
      MODEL_CITIZEN_CONFIG: /config/model-citizen.toml
      LLM_ADDRESS: llm:50051
      LOG_DIR: /logs
    depends_on:
      - llm
    volumes:
      - songs-cache:/songs/
      - ./config:/config:ro
      - ./logs/discord-bot:/logs
      # writable, yt-dlp updates the youtube cookies it's given
      - ./secrets:/secrets

  llm:
    build:
      context: .
      dockerfile: llm/Dockerfile
    # API keys for the chat clients, named by api_key_env in config/llm/
    env_file: .env
    environment:
      LLM_CONFIG: /config/llm
      LOG_DIR: /logs
    volumes:
      - ./config:/config:ro
      - ./logs/llm:/logs

volumes:
  songs-cache:
