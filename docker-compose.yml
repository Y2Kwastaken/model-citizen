services:
  bot:
    build: .
    volumes:
      - music-provider:/music
      # The model rotation. data/ is not in the image, so it is mounted rather
      # than baked in: adding or dropping a model is a restart, not a rebuild.
      - ./data/models.json:/app/models.json:ro
      # go-ytdlp caches the binary under os.UserCacheDir (/root/.cache here).
      # Persist it or every restart re-downloads yt-dlp.
      - ytdlp-cache:/root/.cache
    env_file:
      - path: data/.env
        required: true

volumes:
  music-provider:
  ytdlp-cache:
